name: Pages

# 发布 site/ 里的下载页到 GitHub Pages
# 需要仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 注入当前版本号
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/__VERSION__/v${VERSION}/g" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
